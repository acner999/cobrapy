events {
  worker_connections 1024;
}

http {
  upstream api {
    server api:3000;
  }

  # Redirigir HTTP → HTTPS (después de tener SSL)
  server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

